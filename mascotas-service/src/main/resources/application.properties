spring.application.name=mascotas-service

# Puerto diferente al servicio de usuarios
server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_mascotas
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Misma clave que utiliza usuarios-service
jwt.secret=${JWT_SECRET_BASE64}
